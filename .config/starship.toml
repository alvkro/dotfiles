"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 800

format = """
[╭─](#4a4655)$os$username$hostname[│](#4a4655)$directory$git_branch$git_state$git_status$python$nodejs$rust$lua$golang$c$package$cmd_duration$status[│](#4a4655)$time
[╰─](#4a4655)$character"""

[character]
success_symbol = "[λ](bold #887799)"
error_symbol   = "[λ](bold #c0616f)"
vimcmd_symbol  = "[](bold #b9a3d6)"

[os]
disabled = false
style = "#887799"
format = "[$symbol]($style) "

[os.symbols]
Arch = "󰣇"
Linux = ""
Ubuntu = ""
Debian = ""
Fedora = "󰣛"
Macos = "󰀵"
Windows = "󰍲"

[username]
show_always = true
style_user = "#a39aaf"
style_root = "bold #c0616f"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "#6b6575"
format = "[@$hostname]($style)"

[directory]
style = "bold #b9a3d6"
read_only = " 󰌾"
read_only_style = "#c0616f"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
format = " [󰉋 $path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Videos" = ""
".config" = ""

[git_branch]
symbol = " "
style = "#887799"
format = "[$symbol$branch]($style) "

[git_status]
style = "#d6c4a3"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "󰞇"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "󰆓"
modified = "!${count}"
staged = "+${count}"
renamed = "»"
deleted = "✘${count}"

[git_state]
style = "#c0616f"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[package]
symbol = "󰏗 "
style = "#6b6575"
format = "[$symbol$version]($style) "

[lua]
symbol = "󰢱 "
style = "#6b6575"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "#6b6575"
format = "[$symbol$version( \\($virtualenv\\))]($style) "

[nodejs]
symbol = " "
style = "#6b6575"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "#6b6575"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "#6b6575"
format = "[$symbol$version]($style) "

[c]
symbol = " "
style = "#6b6575"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "#d6c4a3"
format = "[󰔚 $duration]($style) "

[status]
disabled = false
symbol = "✘ "
style = "#c0616f"
format = "[$symbol$status]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "#6b6575"
format = " [󰥔 $time]($style)"
