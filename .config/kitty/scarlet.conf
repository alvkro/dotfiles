# --- TEMA SCARLET (RED & BLACK) ---
# Fundo totalmente preto
background #000000
# Texto padrão em vermelho vibrante
foreground #ff3333

cursor #ff0000
cursor_text_color #000000

selection_background #4d0000
selection_foreground #ffcccc

# --- HACK DE CORES ANSI ---
# Forçando todas as cores para o espectro vermelho/preto
# Isso neutraliza qualquer verde, azul ou ciano do sistema.

# Preto / Cinza (Colors 0 and 8)
color0 #000000
color8 #1a0000

# Vermelho Padrão (Colors 1 and 9)
color1 #ff0000
color9 #ff3333

# Verde forçado para Vermelho Escuro (Colors 2 and 10)
color2  #b30000
color10 #ff4d4d

# Amarelo forçado para Vermelho Intenso (Colors 3 and 11)
color3  #cc0000
color11 #ff6666

# Azul forçado para Bordô/Vinho (Colors 4 and 12)
color4  #800000
color12 #ff1a1a

# Magenta forçado para Vermelho (Colors 5 and 13)
color5  #990000
color13 #ff8080

# Ciano forçado para Vermelho Sangue (Colors 6 and 14) -> (Geralmente a cor do logo do Arch)
color6  #660000
color14 #ff4a4a

# Branco forçado para Rosa/Vermelho Claro (Colors 7 and 15)
color7  #ffb3b3
color15 #ffe6e6
