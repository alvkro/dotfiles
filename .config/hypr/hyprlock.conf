background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

general {
    hide_cursor = false
    grace = 0
}

input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    outer_color = rgb(203, 166, 247)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)
    placeholder_text = <i>Senha...</i>
    fail_text = <i>Senha incorreta</i>
    fail_color = rgb(243, 139, 168)
    check_color = rgb(203, 166, 247)
    position = 0, -80
    halign = center
    valign = center
    rounding = 16
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgb(203, 166, 247)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color = rgb(205, 214, 244)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(205, 214, 244)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}
